<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index-pomodoro-timer-mvp-v2.5</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
  <header>
    <div class="header-left">

    </div>

    <div class="header-mid ">
      <h2>POMODORO TIMER</h2>
    </div>

    <div class="header-right">
      <a href="setting.html" class="btn-circle more_vert" aria-label="設定">
        <span class="material-symbols-outlined">
          more_vert
        </span>
      </a>
    </div>
  </header>

  <main class="main-container">
    <div class="timer-wrapper">
      <svg id="timer-svg" class="timer-svg" viewBox="0 0 100 100" width="200" height="200">
        <circle cx="50" cy="50" r="45" stroke="#333" stroke-width="5" fill="none" />
        <circle id="progress-circle" class="progress-circle" cx="50" cy="50" r="45" stroke-width="5" fill="none"
          stroke-linecap="round" transform="rotate(-90 50 50)" />
      </svg>
    </div>

    <div class="timer-overlay">
      <output id="timer-container" class="timer-container"></output>
      <p id="session-status" class="session-status" aria-live="polite">作業開始</p>
    </div>



  </main>

  <div class="button-layer">
    <button id="refresh-btn" class="refresh-btn" disabled>
      <span class="material-symbols-outlined">
        refresh
      </span>
    </button>

    <button id="control-btn" class="control-btn">
      <span class="material-symbols-outlined">
        play_arrow
      </span>
    </button>
  </div>

  <div class="sub-container">
    <div id="pomodoro-count" class="pomodoro-count">現在 0 ポモドーロ完了！</div>
  </div>

  <script src="js/timer.js"></script>
</body>

</html>
